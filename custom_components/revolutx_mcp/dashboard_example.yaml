# Example Lovelace dashboard for the Revolut X MCP integration.
#
# All entities below live on the single "Revolut X" device this integration
# creates per config entry — see the "Entities" section of this directory's
# README.md for what each one means.
#
# The Balances and Price alerts sections use the community "auto-entities"
# card (https://github.com/thomasloven/lovelace-auto-entities) to list their
# entities dynamically, since both groups are account-specific and grow over
# time: balance sensors are created per currency the first time it's seen,
# and alert-rule sensors are created per rule you add from the integration's
# own entry page, named after the rule's own title — so their entity IDs
# can't be predicted or hardcoded here. Install "auto-entities" via
# HACS > Frontend > search "auto-entities" > Download (HACS registers the
# dashboard resource automatically), then reload the frontend.
#
# Both sections use auto-entities' `filter.template` (a Jinja template,
# rather than the simpler `filter.include`/`exclude` list form) so each
# card's `name` can be computed per entity — every entity here has
# has_entity_name + a shared device, so its default friendly_name is
# "Revolut X <whatever>"; the template strips that repeated device-name
# prefix, and gives each group its own icon so tiles are recognizable at a
# glance even before reading the section heading above them. Matching itself
# is done on the `revolut_x_category` attribute every entity in this
# integration carries (values: account/health/order/monitor/strategy) rather
# than entity_id patterns or device membership — simpler and automatically
# correct as new entities of a given category are added. The price-alert
# template's `name` still assumes the device is named "Revolut X" (the
# default) — if you've renamed it, adjust its `replace("Revolut X ", ...)`
# call to match.
#
# Everything else (Account, Service health) uses fixed, predictable entity
# IDs and needs no adjustment.
#
# How to use this file:
#   Settings > Dashboards > Add dashboard > New dashboard from scratch, give
#   it a name, open it, then the top-right three-dot menu > Edit dashboard >
#   three-dot menu > Edit in YAML, and paste this file's contents over the
#   placeholder, then Save.

title: Revolut X
views:
  - title: Revolut X
    path: revolut-x
    type: sections
    icon: mdi:bitcoin
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Balances
            heading_style: title
            icon: mdi:wallet-outline
          # One tile per currency you hold, found by matching
          # revolut_x_category=account — no per-currency editing needed.
          # name is rebuilt from the sensor's own unit_of_measurement (the
          # currency code) rather than its full "Revolut X <currency>
          # balance" friendly_name, so the device name isn't repeated on
          # every tile; icon marks every tile in this section as a balance.
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              template: >
                [
                {%- for e in states.sensor
                    | selectattr('attributes.revolut_x_category', 'eq', 'account')
                    | map(attribute='entity_id') %}
                {'entity': '{{ e }}',
                 'name': '{{ state_attr(e, "unit_of_measurement") }} balance',
                 'icon': 'mdi:wallet-outline',
                 'type': 'tile'},
                {%- endfor %}
                ]
            sort:
              method: entity_id

      - type: grid
        cards:
          - type: heading
            heading: Account
            heading_style: title
            icon: mdi:swap-horizontal
          - type: tile
            entity: sensor.revolut_x_active_orders
            name: Active orders
            tap_action:
              action: more-info
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Price alerts
            heading_style: title
            icon: mdi:bell-alert-outline
          # One tile per alert rule you've created, found by matching
          # revolut_x_category=monitor — automatically excludes the fixed
          # diagnostic binary_sensors (webhook_registered etc.), which carry
          # revolut_x_category=health instead. name strips the repeated
          # "Revolut X " prefix from each rule's
          # own friendly_name (its title, e.g. "BTC-EUR price above
          # 1000000.0"); state_content adds the rule's own "why"
          # explanation (e.g. current RSI value vs. the rule's threshold)
          # under the state; icon marks every tile here as a price alert.
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              template: >
                [
                {%- for e in states.binary_sensor
                    | selectattr('attributes.revolut_x_category', 'eq', 'monitor')
                    | map(attribute='entity_id') %}
                {'entity': '{{ e }}',
                 'name': '{{ state_attr(e, "friendly_name").replace("Revolut X ", "") }}',
                 'icon': 'mdi:bell-alert-outline',
                 'state_content': ['state', 'detail'],
                 'type': 'tile'},
                {%- endfor %}
                ]
            sort:
              method: name

      - type: grid
        cards:
          - type: heading
            heading: Service health
            heading_style: subtitle
            icon: mdi:heart-pulse
          - type: tile
            entity: sensor.revolut_x_mcp_requests_served
            name: Requests served
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.revolut_x_last_mcp_request_served
            name: Last request served
            grid_options:
              columns: 4
          - type: tile
            entity: binary_sensor.revolut_x_trading_enabled
            name: Trading enabled
            grid_options:
              columns: 4
