# Example Lovelace dashboard for the Revolut X MCP integration.
#
# All entities below live on the single "Revolut X" device this integration
# creates per config entry — see the "Entities" section of this directory's
# README.md for what each one means.
#
# Two groups of entities need to be adjusted for YOUR account before this is
# usable as-is (everything else is a fixed entity ID and will work unchanged):
#
#   1. Balances (## BALANCES section below) — one tile per currency you hold.
#      This integration only creates a sensor for a currency once it's seen
#      a nonzero-or-not balance for it, so the BTC/ETH/USD examples here are
#      just that: examples. Go to Settings > Devices & services > Entities,
#      filter by device "Revolut X", and swap in your own
#      sensor.revolut_x_<currency>_balance entities.
#
#   2. Price alerts (## PRICE ALERTS section below) — one tile per alert rule
#      you've created from the integration's own entry page. Each rule's
#      entity ID is derived from the rule's own title, which you chose, so it
#      can't be predicted here. Same Entities filter as above will show them
#      (they're the non-"balance", non-diagnostic binary_sensor entities on
#      the device) — copy the real entity IDs in.
#
# How to use this file:
#   Settings > Dashboards > Add dashboard > New dashboard from scratch, give
#   it a name, open it, then the top-right three-dot menu > Edit dashboard >
#   three-dot menu > Edit in YAML, and paste this file's contents over the
#   placeholder. Adjust the two sections above, then Save.

title: Revolut X
views:
  - title: Revolut X
    path: revolut-x
    type: sections
    icon: mdi:currency-btc
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Balances
            heading_style: title
            icon: mdi:wallet-outline
          # One tile per currency you hold — see note (1) above.
          - type: tile
            entity: sensor.revolut_x_btc_balance
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.revolut_x_eth_balance
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.revolut_x_usd_balance
            grid_options:
              columns: 4

      - type: grid
        cards:
          - type: heading
            heading: Account
            heading_style: title
            icon: mdi:swap-horizontal
          - type: tile
            entity: sensor.revolut_x_active_orders
            name: Active orders
            tap_action:
              action: more-info
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Price alerts
            heading_style: title
            icon: mdi:bell-alert-outline
          # One tile per alert rule you've created — see note (2) above.
          # state_content adds the rule's own "why" explanation under the
          # on/off state (e.g. current RSI value vs. the rule's threshold).
          - type: tile
            entity: binary_sensor.revolut_x_your_alert_rule_name
            state_content:
              - state
              - detail
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Service health
            heading_style: subtitle
            icon: mdi:heart-pulse
          - type: tile
            entity: sensor.revolut_x_mcp_requests_served
            name: Requests served
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.revolut_x_last_mcp_request_served
            name: Last request served
            grid_options:
              columns: 4
          - type: tile
            entity: binary_sensor.revolut_x_trading_enabled
            name: Trading enabled
            grid_options:
              columns: 4
