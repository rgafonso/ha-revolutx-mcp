# Example Lovelace dashboard for the Revolut X MCP integration.
#
# All entities below live on the single "Revolut X" device this integration
# creates per config entry — see the "Entities" section of this directory's
# README.md for what each one means.
#
# The Balances and Price alerts sections use the community "auto-entities"
# card (https://github.com/thomasloven/lovelace-auto-entities) to list their
# entities dynamically, since both groups are account-specific and grow over
# time: balance sensors are created per currency the first time it's seen,
# and alert-rule sensors are created per rule you add from the integration's
# own entry page, named after the rule's own title — so their entity IDs
# can't be predicted or hardcoded here. Install "auto-entities" via
# HACS > Frontend > search "auto-entities" > Download (HACS registers the
# dashboard resource automatically), then reload the frontend.
#
# Both sections match entities via `filter.include`'s `attributes` clause on
# the `revolut_x_category` attribute every entity in this integration
# carries (values: account/health/order/monitor/strategy) rather than
# entity_id patterns or device membership — simpler and automatically
# correct as new entities of a given category are added. Each card's
# `options.name` is built natively from entity metadata (`type: entity`,
# optionally combined with `type: detail` for a second line) so the
# repeated "Revolut X " device-name prefix — every entity here has
# has_entity_name + a shared device, so its default friendly_name is
# "Revolut X <whatever>" — never shows up on a tile, with no Jinja template
# or device-name assumption to keep in sync if you rename the device.
#
# Everything else (Account, Service health) uses fixed, predictable entity
# IDs and needs no adjustment.
#
# How to use this file:
#   Settings > Dashboards > Add dashboard > New dashboard from scratch, give
#   it a name, open it, then the top-right three-dot menu > Edit dashboard >
#   three-dot menu > Edit in YAML, and paste this file's contents over the
#   placeholder, then Save.

title: Revolut X
views:
  - title: Revolut X
    path: revolut-x
    type: sections
    icon: mdi:bitcoin
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Balances
            heading_style: title
            icon: mdi:wallet-outline
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              include:
                - options:
                    type: tile
                    icon: mdi:cash
                    name:
                      type: entity
                  attributes:
                    revolut_x_category: account
            grid_options:
              columns: full
            sort:
              method: name

      - type: grid
        cards:
          - type: heading
            heading: Account
            heading_style: title
            icon: mdi:swap-horizontal
          - type: tile
            entity: sensor.revolut_x_active_orders
            name: Active orders
            tap_action:
              action: more-info
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Price alerts
            heading_style: title
            icon: mdi:bell-alert-outline
          # One tile per alert rule you've created, found by matching
          # revolut_x_category=monitor — automatically excludes the fixed
          # diagnostic binary_sensors (webhook_registered etc.), which carry
          # revolut_x_category=health instead. name's first line is the
          # rule's own friendly_name/title (e.g. "BTC-EUR price above
          # 1000000.0"); the second (`type: detail`) line adds the rule's
          # own "why" explanation (e.g. current RSI value vs. the rule's
          # threshold).
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              include:
                - options:
                    type: tile
                    name:
                      - type: entity
                      - type: detail
                  attributes:
                    revolut_x_category: monitor
            sort:
              method: name

      - type: grid
        cards:
          - type: heading
            heading: Service health
            heading_style: subtitle
            icon: mdi:heart-pulse
          - type: tile
            entity: sensor.revolut_x_mcp_requests_served
            name: Requests served
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.revolut_x_last_mcp_request_served
            name: Last request served
            grid_options:
              columns: 4
          - type: tile
            entity: binary_sensor.revolut_x_trading_enabled
            name: Trading enabled
            grid_options:
              columns: 4
